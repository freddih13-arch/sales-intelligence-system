[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-intelligence"
version = "0.1.0"
description = "Commercial Intelligence Pipeline for Fintech/Payments/B2B Sales"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "rapidfuzz>=3.6",
    "unidecode>=1.3",
    "PyYAML>=6.0",
    "duckdb>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
